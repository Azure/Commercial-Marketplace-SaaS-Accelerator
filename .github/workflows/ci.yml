# This workflow will run build and unit test on every PR raised.

name: "Build and Run Unit Test on PR"

on:
  pull_request:
    branches: [ "main" ]

env:  
  CUSTOMER_PROJECT: './src/CustomerSite/CustomerSite.csproj'
  PUBLISHER_PROJECT: './src/AdminSite/AdminSite.csproj'
  SERVICES_TEST_PROJECT: './src/Services.Test/Services.Test.csproj'
  DOTNET_CORE_VERSION: '10.0.400'
  
jobs:
  DeploymentScripts:
    name: Test deployment scripts
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - name: Run mocked PowerShell deployment tests
      shell: pwsh
      run: |
        Install-Module Pester -RequiredVersion 5.7.1 -Scope CurrentUser -Force -SkipPublisherCheck
        Import-Module Pester -RequiredVersion 5.7.1
        $result = Invoke-Pester -Path ./deployment/tests -Output Detailed -PassThru
        if ($result.FailedCount -gt 0 -or $result.PassedCount -eq 0) { exit 1 }

  BuildApps:
    name: Build Apps
    runs-on: ubuntu-latest
    
    steps:

    # Checkout the repo
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    # Setup .NET Core SDK
    - name: Setup .NET Core
      uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
      with:
        dotnet-version: ${{ env.DOTNET_CORE_VERSION }} 

    # Run dotnet build and publish
    - name: Build app
      run: |
        dotnet build ${{ env.CUSTOMER_PROJECT }} --configuration Release

    # Run dotnet build and publish
    - name: Build app
      run: |
        dotnet build ${{ env.PUBLISHER_PROJECT }} --configuration Release
        
    # Run unit tests
    - name: Unit Test
      run: dotnet test ${{ env.SERVICES_TEST_PROJECT }}
    
